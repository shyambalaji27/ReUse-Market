<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="ReUse Market — India's trusted peer-to-peer second-hand marketplace. Buy and sell pre-owned products directly from verified first owners. Give Products a Second Life." />
  <meta name="keywords" content="second hand, used products, buy sell, pre-owned, marketplace, India, ReUse Market" />
  <meta name="author" content="ReUse Market" />
  <meta property="og:title" content="ReUse Market — Give Products a Second Life" />
  <meta property="og:description"
    content="Buy Smart. Sell Easy. Reuse More. India's most transparent second-hand marketplace." />
  <meta property="og:type" content="website" />

  <title>ReUse Market — Give Products a Second Life</title>

  <!-- ============================================================
       EXTERNAL DEPENDENCIES
  ============================================================ -->

  <!-- Tailwind CSS (CDN — Full JIT) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              50: '#f0f4ff',
              100: '#e0e9ff',
              200: '#c1d3ff',
              300: '#93b4ff',
              400: '#608eff',
              500: '#3d67fb',
              600: '#2346f5',
              700: '#1a35e3',
              800: '#1b2db8',
              900: '#0f172a',
              950: '#0a0f1d',
            },
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          },
          borderRadius: {
            '3xl': '1.5rem',
            '4xl': '2rem',
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease forwards',
            'scale-up': 'scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'slide-left': 'slideLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'bounce-slow': 'bounce 2s infinite',
          }
        },
      },
    };
  </script>

  <!-- Font Awesome 6 Pro (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />


  <!-- Google Fonts — Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- ============================================================
       PROJECT STYLESHEET
  ============================================================ -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- ============================================================
       INLINE CRITICAL CSS
  ============================================================ -->
  <style>
    /* --- Keyframe Definitions (referenced by Tailwind custom animations) --- */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes scaleUp {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideLeft {
      from {
        transform: translateX(100%);
      }

      to {
        transform: translateX(0);
      }
    }

    /* --- App Shell Layout --- */
    #app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    #navbar-container {
      position: sticky;
      top: 0;
      z-index: 40;
    }

    #app-content {
      flex: 1;
    }

    /* --- SVG Map city pin hover --- */
    .city-pin {
      cursor: pointer;
    }

    .city-pin circle {
      transition: opacity 0.2s;
    }

    /* --- Product card hover lift --- */
    .product-card {
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    /* --- Smooth page transitions --- */
    #app-content {
      animation: fadeIn 0.2s ease;
    }

    /* --- Line-clamp utilities (for older browsers) --- */
    .line-clamp-1 {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
    }

    .line-clamp-2 {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .line-clamp-3 {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    /* --- Scrollbar styling --- */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* --- Modal backdrop z-index --- */
    #modal-container>* {
      z-index: 50;
    }

    /* --- Toast container --- */
    #toast-container {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 24rem;
      pointer-events: none;
    }

    #toast-container>* {
      pointer-events: auto;
    }

    /* --- FAQ chevron rotation --- */
    .rotate-180 {
      transform: rotate(180deg);
    }

    /* --- Prevent horizontal scroll --- */
    body {
      overflow-x: hidden;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans antialiased">

  <!-- ============================================================
       APP SHELL
       - Sticky Navbar at top
       - Dynamic content area (#app-content)  
       - Footer
       - Global Modal container
       - Global Toast container
  ============================================================ -->
  <div id="app-shell">

    <!-- Sticky Navigation Bar (rendered dynamically) -->
    <div id="navbar-container"></div>

    <!-- Main Page Content (SPA route target) -->
    <main id="app-content" role="main" aria-live="polite"></main>

    <!-- Footer (rendered dynamically) -->
    <div id="footer-container"></div>

  </div>

  <!-- Global Modal Layer (Auth, Contact, Wishlist Drawer) -->
  <div id="modal-container" role="dialog" aria-modal="true"></div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- ============================================================
       APPLICATION JAVASCRIPT — LOAD ORDER MATTERS
  ============================================================ -->

  <!-- 1. Demo Data (products, categories, cities, owners) -->
  <script src="js/data.js"></script>

  <!-- 2. Global State Manager -->
  <script src="js/state.js"></script>

  <!-- 3. Reusable UI Components (navbar, cards, modals, footer) -->
  <script src="js/components.js"></script>

  <!-- 4. Leaflet Map Utilities -->
  <script src="js/map.js"></script>

  <!-- 5. Core App Router + Page Renderers -->
  <script src="js/app.js"></script>

</body>

</html>
